name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'deliverables/part1_api_and_containerization/**'
      - 'deliverables/part2_ab_testing/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'deliverables/part1_api_and_containerization/**'
      - 'deliverables/part2_ab_testing/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Lint with Ruff
        run: poetry run ruff check deliverables/part1_api_and_containerization/ deliverables/part2_ab_testing/

      - name: Check formatting with Ruff
        run: poetry run ruff format --check deliverables/part1_api_and_containerization/ deliverables/part2_ab_testing/

      - name: Static Analysis with Mypy
        run: poetry run mypy deliverables/part1_api_and_containerization/ deliverables/part2_ab_testing/

      - name: Run Tests with Pytest
        run: |
          # Usamos --junitxml para generar un reporte compatible con herramientas de CI
          poetry run pytest --junitxml=pytest-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-report.xml
